name: PiPiClaw CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        node-version: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck (node)
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Vue typecheck
        run: npx vue-tsc --noEmit || echo "vue-tsc soft-fail Phase 2"

      - name: ESLint
        run: npm run lint

      - name: Vitest unit
        run: npx vitest run --reporter=verbose

      - name: Build renderer (vite)
        run: npm run build

      - name: Sandbox selfcheck
        run: node scripts/sandbox-selfcheck.mjs || echo "sandbox soft-fail no docker in CI"

      - name: Playwright e2e (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium && npx playwright test --reporter=line || echo "e2e soft-fail Phase 4"
